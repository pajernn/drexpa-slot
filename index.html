<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drexpa Nyereménygép</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Konfetti -->
    <div id="confetti"></div>

    <!-- Logó -->
    <div id="logoContainer">
        <img id="logo" src="images/logo.png" alt="Drexpa">
    </div>

    <!-- Slot -->
    <div id="slotContainer">

        <!-- Futó képek -->
        <div id="slotTrack"></div>

        <!-- Középső keret -->
        <div id="centerFrame"></div>

    </div>

    <!-- Eredmény -->
    <div id="result">

        <h1 id="resultTitle"></h1>

        <h2 id="resultPrize"></h2>

    </div>
    <div id="gameButtons">

    <button id="newCodeBtn">
        🔄 Új kód
    </button>

</div>

    <script src="script.js"></script>

</body>

</html>
