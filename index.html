<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nyerőgép</title>
  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>

  <!-- KÓDBEÍRÓ CONTAINER (Neon stílus) -->
  <div id="codeContainer" class="code-container">
    <h2 class="code-title">PROMÓCIÓS JÁTÉK</h2>
    <p class="code-subtitle">Írd be a blokkon található számsort!</p>
    
    <div class="input-wrapper">
      <!-- Numerikus billentyűzet és számos példa -->
      <input type="text" id="codeInput" inputmode="numeric" pattern="[0-9]*" placeholder="123456" autocomplete="off" spellcheck="false" maxlength="15">
      <button id="spinBtn" onclick="submitCode()">
        <span id="btnText">PÖRGETÉS</span>
        <span id="btnLoader" class="loader hidden">⏳</span>
      </button>
    </div>
    
    <div id="codeMessage" class="code-message"></div>
  </div>

  <!-- A NYERŐGÉP FELÜLETE (Alapból rejtve) -->
  <div id="machineContainer" class="machine-container hidden">
    <div id="resultTitle" class="result-title"></div>
    
    <div class="slot-wrapper">
      <div class="highlight-box"></div>
      <div class="slot-track" id="slotTrack"></div>
    </div>
  </div>

  <script src="script.js?v=3.0"></script>
</body>
</html>
